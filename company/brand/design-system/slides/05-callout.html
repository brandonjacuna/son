<!-- @dsCard group="Slides" viewport="1280x720" name="Major callout" subtitle="Aubergine · two or three per deck maximum" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body { margin:0; }
  .slide { width:1280px; height:720px; background: var(--son-color-aubergine); color: var(--son-color-bone);
           position: relative; overflow: hidden; font-family: var(--son-font-body);
           display: flex; flex-direction: column; justify-content: center;
           padding: 96px 128px; box-sizing: border-box; }
  .fig { font-family: var(--son-font-display); font-weight: 400; font-size: 104px; line-height: 1.02;
         letter-spacing: -0.02em; max-width: 14ch; text-wrap: balance; }
  .cap { font-family: var(--son-font-body); font-weight: 300; font-size: 24px; line-height: 1.5;
         max-width: 26ch; margin-top: 32px; color: var(--son-color-parchment); }
</style>
</head>
<body>
  <div class="slide">
    <div class="fig">One room, first light to last call.</div>
    <p class="cap">A converted residential bungalow. The facade does not announce itself as a restaurant.</p>
  </div>
</body>
</html>
