<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; width: 1280px; height: 854px; overflow: hidden; }
  .tile { display: grid; grid-template-columns: 1fr 200px; width: 1280px; height: 854px; }
  .main { background: var(--son-color-plum-ink); display: flex; align-items: center; justify-content: center; }
  .name { font-family: var(--son-font-wordmark); font-weight: var(--son-weight-book); font-size: 380px; line-height: 1; color: var(--son-color-bone); letter-spacing: -0.01em; }
  .strip { display: grid; grid-template-rows: 1fr 1fr 1fr 1fr; }
</style>
</head>
<body>
  <div class="tile">
    <div class="main"><span class="name">Sŏn</span></div>
    <div class="strip">
      <div style="background: var(--son-color-jade)"></div>
      <div style="background: var(--son-color-onggi)"></div>
      <div style="background: var(--son-color-peacock)"></div>
      <div style="background: var(--son-color-aubergine)"></div>
    </div>
  </div>
</body>
</html>
