<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; }
  .block { margin-bottom: 22px; }
  .lbl { font-family: var(--son-font-body); font-size: 11px; color: var(--son-text-secondary);
         text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 12px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="block">
    <div class="lbl">Button · variants & sizes</div>
    <div class="row" id="btns"></div>
  </div>
  <div class="block">
    <div class="lbl">Button · states</div>
    <div class="row" id="btnstates"></div>
  </div>
  <div class="block">
    <div class="lbl">Badge</div>
    <div class="row" id="badges"></div>
  </div>
  <div class="block">
    <div class="lbl">Card + Divider</div>
    <div id="card"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Badge, Card, Divider } = window.SNDesignSystem_4d795d;
    ReactDOM.createRoot(document.getElementById('btns')).render(<>
      <Button variant="primary">Reserve a table</Button>
      <Button variant="secondary">View the menu</Button>
      <Button variant="ghost">Cancel</Button>
      <Button variant="primary" size="sm">Small</Button>
      <Button variant="primary" size="lg">Large</Button>
    </>);
    ReactDOM.createRoot(document.getElementById('btnstates')).render(<>
      <Button variant="primary">Default</Button>
      <Button variant="primary" disabled>Disabled</Button>
      <Button variant="secondary" disabled>Disabled</Button>
    </>);
    ReactDOM.createRoot(document.getElementById('badges')).render(<>
      <Badge>Dinner</Badge>
      <Badge variant="accent">Late night</Badge>
      <Badge variant="solid">선</Badge>
    </>);
    ReactDOM.createRoot(document.getElementById('card')).render(
      <Card surface="secondary" padding="lg" style={{maxWidth: 360}}>
        <div className="son-eyebrow">Pyeong-sang</div>
        <h3 style={{fontFamily:'var(--son-font-display)', fontSize:26, margin:'10px 0 0'}}>Granted, not found.</h3>
        <Divider label="선" spacing="md" />
        <p style={{fontFamily:'var(--son-font-body)', fontSize:15, margin:0, color:'var(--son-text-secondary)'}}>The slowest pace, the darkest zone. Silence is the product.</p>
      </Card>
    );
  </script>
</body>
</html>
