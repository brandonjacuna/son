<!-- @dsCard group="Spacing" viewport="700x190" name="8pt grid" subtitle="Base unit 8px. Every measure is a multiple." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 32px; }
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .unit { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .bar { background: var(--son-color-peacock); height: 40px; }
  .n { font-family: var(--son-font-body); font-size: 11px; color: var(--son-text-secondary); }
</style>
</head>
<body>
  <div class="scale">
    <div class="unit"><div class="bar" style="width:8px"></div><span class="n">8</span></div>
    <div class="unit"><div class="bar" style="width:16px"></div><span class="n">16</span></div>
    <div class="unit"><div class="bar" style="width:24px"></div><span class="n">24</span></div>
    <div class="unit"><div class="bar" style="width:32px"></div><span class="n">32</span></div>
    <div class="unit"><div class="bar" style="width:48px"></div><span class="n">48</span></div>
    <div class="unit"><div class="bar" style="width:64px"></div><span class="n">64</span></div>
    <div class="unit"><div class="bar" style="width:96px"></div><span class="n">96</span></div>
  </div>
</body>
</html>
