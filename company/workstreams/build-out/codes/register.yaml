# Austin code register. Seeded 2026-09-28 from the construction-mode research.
# status: verified = checked against the city/state source; secondary = from a secondary source, recheck before relying.
# Austin uses the UNIFORM codes for plumbing and mechanical (UPC, UMC), not IPC/IMC. Tag every fact with its family.
