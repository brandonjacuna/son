live_fire_notes:
  - "Solid-fuel appliances need a separate exhaust system (NFPA 96 / UMC 517)."
  - "Spark arresters ahead of grease filters; filters at least 4 ft above the cooking surface."
  - "Site-built solid-fuel appliances need AHJ approval. Meet Austin Fire and the building official early."
