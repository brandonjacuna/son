  <text x="690" y="488" class="ts">C — N2 cylinder Ø≈140 chained to rear leg; reg/manifold plate (dashed) — D4</text>
  <text x="690" y="502" class="ts">D — CIP shelf mid-height (dashed): pump · detergent · TC adapters · waste jug</text>
  <text x="690" y="516" class="ts">E — water treatment (VERIFY #12) at the supply entry (arrow at rear rail)</text>
  <text x="690" y="530" class="ts">◎ — floor siphon ≥ Ø56 at rear; drain hoses (dashed) fall continuously, no traps</text>

