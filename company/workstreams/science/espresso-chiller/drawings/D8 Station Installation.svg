  <!-- notes -->
  <g>
    <rect x="24" y="700" width="652" height="96" fill="none" stroke="#1f3a4d" stroke-width="1.2"/>
    <text x="36" y="718" class="tb">NOTES</text>
    <text x="36" y="734" class="ts">1. Hatch lift path must clear the cassette — both coils rise ~350 mm before tilting; keep the space above the hatch clear.</text>
    <text x="36" y="748" class="ts">2. Bung swaps happen from the FRONT at Zone B: close QD jumpers, slide the pot out — no reaching into the chiller zone.</text>
    <text x="36" y="762" class="ts">3. All product runs ≤ 40 cm and continuously falling (see D3). Zone dimensions reference the FRAME, not the wall.</text>
    <text x="36" y="776" class="ts">4. Bench top 30 mm build-up: 304 sheet over sealed ply or HDPE. Frame 40 × 40 × 3 stainless (or powder steel) tube.</text>
    <text x="36" y="790" class="ts">5. Drill Ø25 holes only after VERIFY #1 head-spacing. Floor anchors optional — level the feet, re-check D3 elevations.</text>
  </g>

