    <text x="700" y="585" class="ts">POWER — machine</text>
    <text x="816" y="585" class="ts">208 V / 30 A dedicated (6-30/L6-30 class — verify plug) · 4.6 kW</text>
    <text x="700" y="606" class="ts">POWER — bench</text>
    <text x="816" y="606" class="ts">duplex 120 V: chiller 3.9 A · logger laptop · CIP 12 V</text>
