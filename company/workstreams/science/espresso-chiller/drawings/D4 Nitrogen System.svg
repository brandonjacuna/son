<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ga4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <style>
    .out { stroke:#1f3a4d; stroke-width:1.8; fill:#ffffff }
    .outlt { stroke:#1f3a4d; stroke-width:1.3; fill:#f2f7f9 }
    .gas { stroke:#7a7a7a; stroke-width:2; fill:none }
    .gasd { stroke:#7a7a7a; stroke-width:1.4; fill:none; stroke-dasharray:7 4 }
    .t { fill:#1f3a4d; font-size:12.5px }
    .ts { fill:#1f3a4d; font-size:11.5px }
    .tb { fill:#1f3a4d; font-size:13.5px; font-weight:bold }
    .h1 { fill:#1f3a4d; font-size:17px; font-weight:bold }
    .h2 { fill:#1f3a4d; font-size:13.5px; font-weight:bold }
    .sym { stroke:#1f3a4d; stroke-width:1.6; fill:#ffffff }
    .dimt { fill:#b45309; font-size:12px }
    .steel { fill:#dde4e9 }
  </style>
  <rect x="0" y="0" width="1180" height="820" fill="#ffffff"/>
  <rect x="8" y="8" width="1164" height="804" fill="none" stroke="#1f3a4d" stroke-width="1.5"/>
  <text x="24" y="38" class="h1">D4 — NITROGEN FLUSH &amp; BLANKET SYSTEM</text>
  <text x="24" y="58" class="ts">Beverage-grade N2 · 10 psi header · three metered legs · the airpot is NEVER pressurized (vent open whenever gas flows; ≤ 0.5 psi at any vessel)</text>

  <!-- ================= LEFT: GAS TRAIN ================= -->
  <text x="40" y="96" class="h2">GAS TRAIN</text>

  <!-- cylinder -->
  <rect x="46" y="150" width="44" height="150" rx="14" class="outlt"/>
  <rect x="58" y="132" width="20" height="18" class="out"/>
  <text x="36" y="322" class="ts">40 cu ft N2, CGA580</text>
  <text x="36" y="336" class="ts">beverage grade, chained</text>
  <text x="36" y="350" class="ts">upright to frame</text>

  <!-- regulator -->
  <line x1="90" y1="141" x2="140" y2="141" class="gas"/>
  <rect x="140" y="126" width="56" height="30" class="sym"/>
  <circle cx="152" cy="118" r="9" class="sym"/>
  <circle cx="182" cy="118" r="9" class="sym"/>
  <text x="96" y="176" class="ts">Taprite/Kegco N2 beer-gas</text>
  <text x="96" y="190" class="ts">regulator — set 10 psi</text>

  <!-- header manifold -->
  <line x1="196" y1="141" x2="260" y2="141" class="gas"/>
  <rect x="260" y="120" width="26" height="260" class="outlt"/>
  <text x="252" y="398" class="ts">4-port header (spare capped)</text>

  <!-- Leg template: ball valve (bowtie), needle valve (N), rotameter (tall rect), check (arrow-in-circle), QD -->
  <!-- LEG A -->
  <line x1="286" y1="150" x2="340" y2="150" class="gas"/>
  <path d="M 340 143 L 354 157 L 340 157 L 354 143 Z" class="sym"/>
  <line x1="354" y1="150" x2="392" y2="150" class="gas"/>
  <circle cx="402" cy="150" r="10" class="sym"/><text x="397" y="154" class="ts">N</text>
  <line x1="412" y1="150" x2="440" y2="150" class="gas"/>
  <rect x="440" y="130" width="16" height="40" class="sym"/><circle cx="448" cy="158" r="4" fill="#7a7a7a"/>
  <line x1="456" y1="150" x2="484" y2="150" class="gas"/>
  <circle cx="494" cy="150" r="10" class="sym"/><path d="M 488 150 L 498 150 M 494 146 L 498 150 L 494 154" stroke="#1f3a4d" stroke-width="1.4" fill="none"/>
  <line x1="504" y1="150" x2="530" y2="150" class="gas" marker-end="url(#ga4)"/>
  <text x="540" y="146" class="tb">LEG A — FUNNEL BLANKETS</text>
  <text x="540" y="162" class="ts">~1.0 L/min total, continuous while batching;</text>
  <text x="540" y="176" class="ts">splits to 2 × 1/8 in lines → lid galleries (0.5 mm orifices balance flow)</text>

  <!-- LEG B -->
  <line x1="286" y1="235" x2="340" y2="235" class="gas"/>
  <path d="M 340 228 L 354 242 L 340 242 L 354 228 Z" class="sym"/>
  <line x1="354" y1="235" x2="392" y2="235" class="gas"/>
  <circle cx="402" cy="235" r="10" class="sym"/><text x="397" y="239" class="ts">N</text>
  <line x1="412" y1="235" x2="440" y2="235" class="gas"/>
  <rect x="440" y="215" width="16" height="40" class="sym"/><circle cx="448" cy="243" r="4" fill="#7a7a7a"/>
  <line x1="456" y1="235" x2="484" y2="235" class="gas"/>
  <circle cx="494" cy="235" r="10" class="sym"/><path d="M 488 235 L 498 235 M 494 231 L 498 235 L 494 239" stroke="#1f3a4d" stroke-width="1.4" fill="none"/>
  <line x1="504" y1="235" x2="530" y2="235" class="gas" marker-end="url(#ga4)"/>
  <text x="540" y="231" class="tb">LEG B — BUNG SWEEP (fill only)</text>
  <text x="540" y="247" class="ts">0.5–1 L/min via QD to the bung gas tee;</text>
  <text x="540" y="261" class="ts">vent (one-way, low-crack) OPEN whenever gas flows; capped for storage</text>

  <!-- LEG C -->
  <line x1="286" y1="320" x2="340" y2="320" class="gas"/>
  <path d="M 340 313 L 354 327 L 340 327 L 354 313 Z" class="sym"/>
  <line x1="354" y1="320" x2="392" y2="320" class="gas"/>
  <circle cx="402" cy="320" r="10" class="sym"/><text x="397" y="324" class="ts">N</text>
  <line x1="412" y1="320" x2="440" y2="320" class="gas"/>
  <rect x="440" y="300" width="16" height="40" class="sym"/><circle cx="448" cy="328" r="4" fill="#7a7a7a"/>
  <line x1="456" y1="320" x2="484" y2="320" class="gas"/>
  <circle cx="494" cy="320" r="10" class="sym"/><path d="M 488 320 L 498 320 M 494 316 L 498 320 L 494 324" stroke="#1f3a4d" stroke-width="1.4" fill="none"/>
  <line x1="504" y1="320" x2="530" y2="320" class="gas" marker-end="url(#ga4)"/>
  <text x="540" y="316" class="tb">LEG C — COIL PURGE</text>
  <text x="540" y="332" class="ts">~0.1 L/min via QD to the purge stopper; 3 coil volumes ≈ 60 mL ≈ 40–60 s;</text>
  <text x="540" y="346" class="ts">plug advances ~0.25 m/s in the 3 mm bore — no atomizing, no channeling</text>

  <!-- legend for symbols -->
  <rect x="40" y="420" width="490" height="86" class="outlt"/>
  <path d="M 56 442 L 70 456 L 56 456 L 70 442 Z" class="sym"/><text x="80" y="453" class="ts">isolation ball valve</text>
  <circle cx="216" cy="449" r="10" class="sym"/><text x="211" y="453" class="ts">N</text><text x="232" y="453" class="ts">needle (metering) valve</text>
  <rect x="56" y="470" width="16" height="26" class="sym"/><circle cx="64" cy="488" r="4" fill="#7a7a7a"/><text x="80" y="487" class="ts">rotameter 0.1–1.5 LPM</text>
  <circle cx="290" cy="483" r="10" class="sym"/><path d="M 284 483 L 294 483 M 290 479 L 294 483 L 290 487" stroke="#1f3a4d" stroke-width="1.4" fill="none"/><text x="306" y="487" class="ts">check valve (flow →)</text>
  <text x="392" y="453" class="ts">QD = beverage-industry</text>
  <text x="392" y="467" class="ts">1/4 in quick-disconnect</text>

  <!-- consumption box -->
  <rect x="40" y="530" width="490" height="120" class="outlt"/>
  <text x="52" y="552" class="tb">CONSUMPTION &amp; SEQUENCE</text>
  <text x="52" y="572" class="ts">Session (40 min): blankets ~40 L + bung sweep ~20–30 L + purges ~1 L ≈ 2 scf</text>
  <text x="52" y="588" class="ts">→ 40 cu ft cylinder ≈ 2–4 weeks at daily batching; swap at any gas supplier</text>
  <text x="52" y="608" class="ts">START: purge each coil (C) → blankets on (A) → bung trickle on (B) → pull shots</text>
  <text x="52" y="624" class="ts">END: B off, vent capped → forward-purge coils (C) pushes held product to the pot</text>
  <text x="52" y="640" class="ts">→ then CIP. Purge pressure needed at the U: ~0.3 psi (17 cm lift) — trivial</text>

  <!-- ================= RIGHT: DETAILS ================= -->
  <text x="620" y="410" class="h2">FUNNEL LID — GAS GALLERY (section)</text>
  <!-- funnel cross-section -->
  <g>
    <!-- cone -->
    <path d="M 660 500 L 790 500 L 740 560 L 740 590 L 710 590 L 710 560 Z" class="steel" stroke="#1f3a4d" stroke-width="1.8"/>
    <!-- rear-exit neck -->
    <path d="M 710 590 L 740 590 L 736 604 L 714 604 Z" class="steel" stroke="#1f3a4d" stroke-width="1.4"/>
    <!-- lid -->
    <rect x="652" y="478" width="146" height="16" class="steel" stroke="#1f3a4d" stroke-width="1.8"/>
    <!-- spout slots -->
    <rect x="686" y="474" width="18" height="24" fill="#ffffff" stroke="#1f3a4d" stroke-width="1.2"/>
    <rect x="746" y="474" width="18" height="24" fill="#ffffff" stroke="#1f3a4d" stroke-width="1.2"/>
    <!-- gallery groove -->
    <rect x="660" y="486" width="12" height="6" fill="#ffffff" stroke="#7a7a7a" stroke-width="1"/>
    <rect x="778" y="486" width="12" height="6" fill="#ffffff" stroke="#7a7a7a" stroke-width="1"/>
    <!-- gas inlet -->
    <line x1="620" y1="489" x2="660" y2="489" class="gas" marker-end="url(#ga4)"/>
    <text x="560" y="482" class="ts">N2 in,</text>
    <text x="560" y="496" class="ts">10-32 port</text>
    <!-- angled jets -->
    <line x1="666" y1="492" x2="672" y2="510" class="gasd"/>
    <line x1="784" y1="492" x2="778" y2="510" class="gasd"/>
    <text x="800" y="516" class="ts">6–8 × Ø0.5 mm holes angled</text>
    <text x="800" y="530" class="ts">down — inert curtain over</text>
    <text x="800" y="544" class="ts">the liquid; excess exits UP</text>
    <text x="800" y="558" class="ts">the spout slots (air kept out)</text>
    <text x="620" y="620" class="ts">CNC 316 cone Ø60–70, ~30 mL surge; rear-exit</text>
    <text x="620" y="634" class="ts">neck slopes down over the tray lip (no rise)</text>
    <!-- spout label -->
    <text x="640" y="448" class="ts">lid opening = open KIDNEY SLOT along the portafilter swing arc —</text>
    <text x="640" y="462" class="ts">spouts hover ~10 mm above, never captured; lock/unlock unchanged</text>
  </g>

  <text x="620" y="676" class="h2">PURGE STOPPER · BUNG GAS TEE</text>
  <!-- purge stopper -->
  <path d="M 660 700 L 700 700 L 694 730 L 666 730 Z" class="outlt"/>
  <rect x="674" y="686" width="12" height="14" class="out"/>
  <text x="620" y="750" class="ts">tapered silicone stopper,</text>
  <text x="620" y="764" class="ts">1/4 in barb — seats in funnel</text>
  <text x="620" y="778" class="ts">mouth; self-seals at 0.3 psi</text>
  <!-- bung tee -->
  <g>
    <line x1="880" y1="700" x2="880" y2="736" class="gas"/>
    <line x1="852" y1="700" x2="908" y2="700" class="gas"/>
    <circle cx="838" cy="700" r="10" class="sym"/><path d="M 832 700 L 842 700 M 838 696 L 842 700 L 838 704" stroke="#1f3a4d" stroke-width="1.4" fill="none"/>
    <line x1="828" y1="700" x2="800" y2="700" class="gas"/>
    <text x="770" y="688" class="ts">N2 in (leg B)</text>
    <rect x="908" y="692" width="26" height="16" class="sym"/>
    <text x="942" y="704" class="ts">vent: one-way umbrella check</text>
    <text x="942" y="718" class="ts">(cracks &lt; 0.1 psi, outflow only)</text>
    <text x="942" y="732" class="ts">+ storage cap</text>
    <text x="856" y="756" class="ts">to bung gas port —</text>
    <text x="856" y="770" class="ts">headspace swept during fill,</text>
    <text x="856" y="784" class="ts">static blanket in storage</text>
  </g>

  <!-- title block -->
  <g>
    <rect x="40" y="676" width="490" height="116" fill="none" stroke="#1f3a4d" stroke-width="1.2"/>
    <text x="52" y="700" class="tb">SAFETY / SPEC NOTES</text>
    <text x="52" y="720" class="ts">1. Never pressurize the airpot (vacuum flask): vent open whenever leg B flows.</text>
    <text x="52" y="736" class="ts">2. Header 10 psi; all vessel-facing flows metered; ≤ 0.5 psi at any vessel.</text>
    <text x="52" y="752" class="ts">3. Beverage-grade N2. Cylinder chained upright. Room volume &gt;&gt; 1.1 m³ release.</text>
    <text x="52" y="768" class="ts">4. Check valves on every leg — no coffee or air back-migration into the train.</text>
    <text x="52" y="786" class="ts">DWG D4 · REV B · 2026-08-07 · companion to D2 (flow) and package §7.1</text>
  </g>
</svg>
