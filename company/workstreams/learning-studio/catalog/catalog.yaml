# Module catalog. One row per module. Status must match the module's module.md.
# Seeds below are drawn from commitments already on record in the white paper (canon; V7 Part II is
# background only, not canon) and the
# brand canon, as cited by the Learning & Development and Scaling People profiles.
# They are unconfirmed until Brandon confirms them in an /identify session.

modules:

  - id: ORI-001
    title: Why before how
    domain: orientation
    status: identified
    confirmed: false
    need: >
      Orientation to mission, values, and the standard comes before operational
      training. Every new member needs the reason before the mechanics.
    source: white paper onboarding commitment (V7 Part II background only, not canon), as cited in the Instructional Designer profile

  - id: LEA-001
    title: Teaching at Sŏn
    domain: teaching-leadership
    status: identified
    confirmed: false
    need: >
      Qualified members can author and teach modules and are paid to teach.
      Peer authors need to learn the template and how to teach a module, or the
      library fragments.
    source: white paper peer-authoring commitment (V7 Part II background only, not canon), as cited in the Curriculum & Program Architect and Instructional Designer profiles

  - id: SVC-001
    title: Getting to table-ready
    domain: service-craft
    status: identified
    confirmed: false
    need: >
      No one touches a table until demonstrably ready. Learners need a clear path
      to that gate and to know what ready looks like.
    source: white paper readiness-gate commitment (V7 Part II background only, not canon), as cited in the Curriculum & Program Architect profile

  - id: SVC-002
    title: Recovering a mistake well
    domain: service-craft
    status: identified
    confirmed: false
    need: >
      Recovery is a designed capability, including pre-authorized customer gestures
      decided as system calls, not floor improvisation.
    source: Hospitality Operations Realist profile, citing Brand Guidelines (pre-authorized gestures) and V7 (background only, not canon)

  - id: SAF-001
    title: Taking an allergy at the table
    domain: safety-compliance
    status: identified
    confirmed: false
    need: >
      Allergy routing must never depend on a server judging severity. Real build of
      the example module once chef and assessment seats are engaged.
    source: Studio example EX-001; chef-gated and assessment-gated

  - id: CUL-001
    title: The pre-service brief
    domain: culture
    status: identified
    confirmed: false
    need: >
      Pre-service carries two objects: the operational readiness brief (86s,
      allergies, VIPs, gaps) and the team-making ritual. Leads need to run both,
      and keep the operational half even when time is short.
    source: Hospitality Operations Realist profile (worked example 6), Culture Implementer seam
