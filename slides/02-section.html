<!-- @dsCard group="Slides" viewport="1280x720" name="Section divider" subtitle="Plum Ink ground · single line · one per section" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body { margin:0; }
  .slide { width:1280px; height:720px; background: var(--son-color-plum-ink); color: var(--son-color-bone);
           position: relative; overflow: hidden; font-family: var(--son-font-body);
           display: flex; flex-direction: column; justify-content: flex-end;
           padding: 96px 128px; box-sizing: border-box; }
  .num { position: absolute; top: 96px; left: 128px; font-family: var(--son-font-serif);
         font-size: 13px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--son-color-parchment); }
  .glyph { position: absolute; top: 88px; right: 128px; font-family: var(--son-font-korean);
           font-size: 30px; color: var(--son-color-bone); }
  h2 { font-family: var(--son-font-display); font-weight: 400; font-size: 72px; line-height: 1.04;
       letter-spacing: -0.015em; max-width: 16ch; }
</style>
</head>
<body>
  <div class="slide">
    <span class="num">02 · The space</span>
    <span class="glyph">선</span>
    <h2>The room recedes. The table comes forward.</h2>
  </div>
</body>
</html>
