<!-- @dsCard group="Slides" viewport="1280x720" name="Statement slide" subtitle="One sentence carries the slide · Bone ground" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body { margin:0; }
  .slide { width:1280px; height:720px; background: var(--son-color-bone); color: var(--son-color-plum-ink);
           position: relative; overflow: hidden; font-family: var(--son-font-body);
           display: flex; flex-direction: column; justify-content: center;
           padding: 96px 128px; box-sizing: border-box; }
  .eyebrow { font-family: var(--son-font-serif); font-size: 13px; text-transform: uppercase;
             letter-spacing: 0.2em; color: var(--son-color-peacock); margin-bottom: 40px; }
  h2 { font-family: var(--son-font-display); font-weight: 400; font-size: 60px; line-height: 1.08;
       letter-spacing: -0.012em; max-width: 19ch; }
  em { font-style: italic; }
</style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">Positioning</div>
    <h2>Korean restraint. Texas warmth. <em>Polished but playful.</em></h2>
  </div>
</body>
</html>
