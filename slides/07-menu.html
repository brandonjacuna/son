<!-- @dsCard group="Slides" viewport="1280x720" name="Menu specimen" subtitle="Sŏn dinner register · name carries identity" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body { margin:0; }
  .slide { width:1280px; height:720px; background: var(--son-color-parchment); color: var(--son-color-plum-ink);
           position: relative; overflow: hidden; font-family: var(--son-font-body);
           padding: 104px 128px; box-sizing: border-box; }
  .eyebrow { font-family: var(--son-font-serif); font-size: 13px; text-transform: uppercase;
             letter-spacing: 0.2em; color: var(--son-color-onggi); margin-bottom: 48px; }
  .menu { max-width: 60ch; }
  .item { padding: 22px 0; border-top: 1px solid var(--son-border-default); }
  .item:last-child { border-bottom: 1px solid var(--son-border-default); }
  .name { font-family: var(--son-font-display); font-weight: 400; font-size: 34px; line-height: 1.1; }
  .desc { font-family: var(--son-font-body); font-size: 17px; line-height: 1.5; margin-top: 8px;
          color: color-mix(in srgb, var(--son-color-plum-ink) 78%, transparent); max-width: 44ch; }
</style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">Sŏn · dinner</div>
    <div class="menu">
      <div class="item">
        <div class="name">Galbi</div>
      </div>
      <div class="item">
        <div class="name">Doenjang</div>
      </div>
    </div>
  </div>
</body>
</html>
