<!-- @dsCard group="Colors" viewport="700x150" name="Chromatic accents" subtitle="Jade, Peacock, Onggi. One green, one green, one clay." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border: 1px solid var(--son-border-default); }
  .chip { height: 84px; }
  .meta { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .name { font-family: var(--son-font-serif); font-size: 15px; }
  .hex { font-family: var(--son-font-body); font-size: 12px; color: var(--son-text-secondary); letter-spacing: 0.04em; }
  .role { font-family: var(--son-font-body); font-size: 11px; color: var(--son-text-secondary); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background: var(--son-color-jade)"></div>
      <div class="meta"><span class="name">Jade</span><span class="hex">#8DA982</span><span class="role">Morning · late-night accent</span></div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--son-color-peacock)"></div>
      <div class="meta"><span class="name">Peacock</span><span class="hex">#3E5640</span><span class="role">Structure · support</span></div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--son-color-onggi)"></div>
      <div class="meta"><span class="name">Onggi</span><span class="hex">#804A33</span><span class="role">Earthen clay · Dosi</span></div>
    </div>
  </div>
</body>
</html>
