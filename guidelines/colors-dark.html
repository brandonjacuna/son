<!-- @dsCard group="Colors" viewport="700x150" name="Dark environments" subtitle="Plum Ink and Aubergine. Dinner and late night." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; }
  .row { display: flex; gap: 16px; }
  .sw { flex: 1; border: 1px solid var(--son-border-default); }
  .chip { height: 84px; }
  .meta { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .name { font-family: var(--son-font-serif); font-size: 15px; }
  .hex { font-family: var(--son-font-body); font-size: 12px; color: var(--son-text-secondary); letter-spacing: 0.04em; }
  .role { font-family: var(--son-font-body); font-size: 11px; color: var(--son-text-secondary); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background: var(--son-color-plum-ink)"></div>
      <div class="meta"><span class="name">Plum Ink</span><span class="hex">#120916</span><span class="role">Hero dark · dinner · son.color.plum-ink</span></div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--son-color-aubergine)"></div>
      <div class="meta"><span class="name">Aubergine</span><span class="hex">#2E1F31</span><span class="role">Secondary dark · late night · son.color.aubergine</span></div>
    </div>
  </div>
</body>
</html>
